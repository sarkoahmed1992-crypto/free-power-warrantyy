<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>فری پاوەر - سیستەمی زەمانی ئینڤێرتەر و مەواد</title>
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <header class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold text-amber-400">فری پاوەر (FREE POWER)</h1>
                <p class="text-xs text-slate-400">بۆ فرۆشتنی کاڵای ووزەی خۆر</p>
            </div>
        </header>
        <div class="bg-slate-800 border border-slate-700 p-5 rounded-2xl shadow-xl text-center space-y-3">
            <h2 class="text-base font-bold text-emerald-400">✅ سیستەمی زەمان بە سەرکەوتوویی کار دەکات!</h2>
            <p class="text-xs text-slate-300">فایلی سەرەکی بە سەرکەوتوویی بەرز کرایەوە.</p>
        </div>
    </div>
</body>
</html>
